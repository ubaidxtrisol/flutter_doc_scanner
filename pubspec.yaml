name: flutter_doc_scanner
description: "Camera + on-device detection engine for the scanner app (iOS Vision, Android CameraX + OpenCV)."
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.shirsh.flutter_doc_scanner
        pluginClass: FlutterDocScannerPlugin
      ios:
        pluginClass: SwiftFlutterDocScannerPlugin
