name: flutter_doc_scanner
description: "Scanner module: native camera + detection engine (Android CameraX/OpenCV/ML Kit/ARCore, iOS Vision/ARKit) and the complete Flutter scanner UI."
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any # DateFormat for card dates; version pinned by flutter_localizations
  figma_squircle: ^0.6.3 # continuous corners with the design's 60% smoothing
  iconsax_plus: ^1.0.0 # Iconsax Linear + Bold, as in the design
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  pdf: ^3.13.1
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  vector_math: ^2.1.4
  qr: ^3.0.2
  flutter_math_fork: ^0.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true # enables `flutter gen-l10n` (see l10n.yaml)
  plugin:
    platforms:
      android:
        package: com.shirsh.flutter_doc_scanner
        pluginClass: FlutterDocScannerPlugin
      ios:
        pluginClass: SwiftFlutterDocScannerPlugin
